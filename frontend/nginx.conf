server {
  listen 8080;
  server_name _;
  # Inherited combined logs expose request queries and untrusted header values.
  access_log off;
  # Ordinary proxy errors also include request context; match the ingress policy.
  error_log /dev/stderr crit;
  root /usr/share/nginx/html;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}

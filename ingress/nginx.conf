# Credential-free fixed reverse proxy. This is the sole default egress exception.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_max_body_size 1m;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 15s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 30s;
  proxy_http_version 1.1;
  proxy_set_header Host $proxy_host;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Connection "";
  proxy_set_header Upgrade "";
  proxy_set_header Forwarded "";
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-Proto "";
  proxy_set_header X-Forwarded-Port "";
  proxy_set_header X-Forwarded-Prefix "";
  proxy_set_header X-Real-IP "";
  proxy_set_header X-Original-URL "";
  proxy_set_header X-Rewrite-URL "";
  proxy_set_header Proxy "";
  proxy_set_header Proxy-Authorization "";
  proxy_set_header Proxy-Connection "";
  proxy_ignore_headers X-Accel-Redirect;
  proxy_hide_header X-Accel-Redirect;
  proxy_hide_header Refresh;
  proxy_redirect off;
  proxy_intercept_errors on;
  server {
    listen 8080 default_server;
    server_name _;
    if ($request_method = CONNECT) { return 405; }
    if ($request ~* "^[A-Z]+ +https?://") { return 400; }
    error_page 301 302 303 307 308 = @redirect_denied;
    location @redirect_denied { return 502; }
    location / {
      proxy_pass http://backend:8080;
    }
  }
  server {
    listen 8081 default_server;
    server_name _;
    if ($request_method = CONNECT) { return 405; }
    if ($request ~* "^[A-Z]+ +https?://") { return 400; }
    error_page 301 302 303 307 308 = @redirect_denied;
    location @redirect_denied { return 502; }
    location / {
      proxy_pass http://frontend:8080;
    }
  }
}

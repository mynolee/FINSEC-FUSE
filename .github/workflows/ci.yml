name: FINSEC FUSE verification
on:
  push:
    branches: [dev, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prerequisites:
    name: Component presence (missing is SKIPPED, not verified)
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.gate.outputs.backend }}
      agent_harness: ${{ steps.gate.outputs.agent_harness }}
      process_recovery: ${{ steps.gate.outputs.process_recovery }}
      frontend: ${{ steps.gate.outputs.frontend }}
      combined: ${{ steps.gate.outputs.combined }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.15'
      - name: Mark incomplete feature trees explicitly
        id: gate
        env:
          REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          args=()
          if [[ "$REVIEW_BRANCH" == chore/integration-verification* ]]; then
            args+=(--require-complete)
          fi
          python scripts/ci-prerequisites.py "${args[@]}"
      - name: Check gate and public artifact safeguards without services
        run: python scripts/ci-support-test.py
      - name: Check local container-network harness safeguards without services
        run: python scripts/container-network-test.py

  backend:
    name: Backend unit and PostgreSQL 16.15 integration
    needs: prerequisites
    if: needs.prerequisites.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.15'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Run both registered test tasks (raw reports remain private)
        run: python scripts/ci-run.py --label backend-build -- ./gradlew --no-daemon --console=plain build
      - name: Require nonzero unit and integration counts with no failures or skips
        if: always()
        run: python scripts/ci-test-report.py
      - name: Publish aggregate test counts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-counts
          path: safe-artifacts/backend-test-summary.json
          if-no-files-found: error
          retention-days: 7

  process-recovery:
    name: Real process crashes and PostgreSQL outage recovery
    needs: prerequisites
    if: needs.prerequisites.outputs.process_recovery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.15'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Kill real child JVMs and stop/restart isolated PostgreSQL
        run: python scripts/ci-run.py --label process-recovery -- scripts/test-process-recovery.sh --gradle ./gradlew
      - name: Verify all five scenarios, cleanup and unchanged current source
        if: always()
        run: python scripts/ci-process-report.py
      - name: Publish fixed aggregate verdicts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: process-recovery-counts
          path: safe-artifacts/process-recovery-summary.json
          if-no-files-found: error
          retention-days: 7

  agent-and-harness:
    name: Python agent and evaluation harness
    needs: prerequisites
    if: needs.prerequisites.outputs.agent_harness == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - run: python -m pip install -r agent/requirements-dev.txt
      - name: Python tests (no provider calls)
        run: python scripts/ci-run.py --label python-tests -- python -m pytest -q agent/tests evaluation/tests
      - name: Validate fixture plan separately from executed outcomes
        run: python -m evaluation.scenario_runner validate-fixtures

  frontend:
    name: Frontend build and component tests
    needs: prerequisites
    if: needs.prerequisites.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: python scripts/ci-run.py --label frontend-build -- npm --prefix frontend run build
      - name: Component tests are separate from real browser verification
        run: python scripts/ci-run.py --label frontend-tests -- npm --prefix frontend test -- --run

  combined-compose-browser:
    name: Combined tree only — Compose, real browser, full paired replay
    needs: prerequisites
    if: needs.prerequisites.outputs.combined == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: fuse-ci-${{ github.run_id }}-${{ github.run_attempt }}
      FUSE_UI_URL: http://127.0.0.1:5173
      FUSE_E2E_INTEGRATION: '1'
      FUSE_UI_SECURITY_HEADERS: '1'
      FUSE_E2E_ENV_FILE: ${{ github.workspace }}/.env
      FUSE_E2E_SUMMARY_PATH: ${{ github.workspace }}/safe-artifacts/browser-summary.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r agent/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - name: Type-check browser tests and safe reporter
        run: npx tsc --ignoreConfig --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --types node playwright.config.ts tests/e2e/*.ts
        working-directory: frontend
      - name: Install version-matched Chromium on this new isolated CI runner
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Bootstrap fresh random mock credentials (provider disabled)
        run: python scripts/ci-verify.py prepare
      - name: Build and wait for this project's Compose services
        run: python scripts/ci-run.py --label compose-up -- docker compose up --build --detach --wait --wait-timeout 240
      - name: Verify actual service readiness
        run: python scripts/ci-verify.py ready
      - name: Verify actual workload network isolation with local synthetic fixtures
        run: python scripts/container-network-check.py
      - name: Real authenticated browser workflows, approval, quarantine, recovery and export
        run: npm run test:e2e
        working-directory: frontend
      - name: Real HTTP smoke and repeated-request ledger observation
        run: python scripts/ci-verify.py smoke
      - name: Compare browser outcomes with read-only PostgreSQL observations
        run: python scripts/ci-verify.py database
      - name: Execute all 60 paired replay cases and export reviewed safe evidence
        run: python scripts/ci-verify.py evidence
      - name: Always capture fixed readiness and container-state diagnostics before teardown
        if: always()
        run: python scripts/ci-verify.py diagnostics
      - name: Always remove only this run's Compose containers and volumes
        if: always()
        run: python scripts/ci-run.py --label compose-cleanup -- docker compose --project-name "$COMPOSE_PROJECT_NAME" down --volumes --remove-orphans
      - name: Publish only allowlisted evidence and aggregate check summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: combined-safe-verification-evidence
          path: safe-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: State verification scope and privacy limits
        if: always()
        run: |
          printf '%s\n' '## Combined verification scope' \
            'This job verifies only the checked-out combined tree on a fresh isolated CI runner.' \
            'Inspect individual step outcomes. Missing or failed checks are not passing verification.' \
            'Mock workflows and synthetic REPLAY only. LIVE robustness and deployment are NOT_RUN.' \
            'Only safe evidence projections and counts are uploaded; raw test reports, service logs, browser recordings, credentials and private prompts are withheld.' >> "$GITHUB_STEP_SUMMARY"

  supply-chain:
    name: Local SAST, secret, SCA and SBOM release gate
    needs: prerequisites
    if: needs.prerequisites.outputs.combined == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Install selected local scanners (private install diagnostics)
        run: python scripts/ci-run.py --label scanner-install -- python -m pip install -r scripts/security/requirements.txt
      - name: Pin npm advisory and SBOM client
        run: python scripts/ci-run.py --label scanner-npm-install -- npm install --global npm@11.9.0
      - name: Prove fail-closed scanner and privacy boundaries
        run: |
          python scripts/security-scan-test.py
          python scripts/compose-security-test.py
      - name: Resolve Java dependency inventory
        run: python scripts/ci-run.py --label dependency-inventory -- ./gradlew --no-daemon --console=plain writeDependencyInventory
      - name: Run actual scanners without sending source to remote analysis
        if: always()
        run: python scripts/security-scan.py
      - name: Publish aggregate security counts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-counts
          path: safe-artifacts/security-summary.json
          if-no-files-found: error
          retention-days: 7
